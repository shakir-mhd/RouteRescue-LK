<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Shield Gold/Orange Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Beacon Blue Gradient -->
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Squircle Badge Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>

  <!-- Outer Neon Glow Shield Contour -->
  <path d="M 256 70 L 390 120 C 390 280 320 380 256 430 C 192 380 122 280 122 120 Z" fill="none" stroke="#f97316" stroke-width="12" filter="url(#orangeGlow)"/>

  <!-- Main Shield Body -->
  <path d="M 256 86 L 374 130 C 374 270 310 360 256 406 C 202 360 138 270 138 130 Z" fill="url(#shieldGrad)" stroke="#0f172a" stroke-width="8"/>

  <!-- Inner Dark Shield Plate -->
  <path d="M 256 112 L 350 148 C 350 260 298 335 256 374 C 214 335 162 260 162 148 Z" fill="#0f172a"/>

  <!-- Emergency Siren Beacon Light -->
  <path d="M 230 180 A 26 26 0 0 1 282 180 L 286 200 L 226 200 Z" fill="url(#beaconGrad)" stroke="#38bdf8" stroke-width="3"/>
  <rect x="220" y="200" width="72" height="10" rx="4" fill="#0284c7"/>

  <!-- Crossed Wrench Left -->
  <g transform="translate(256, 250) rotate(-35) translate(-256, -250)">
    <rect x="246" y="170" width="20" height="120" rx="6" fill="#f97316"/>
    <path d="M 236 165 C 230 180 240 195 256 195 C 272 195 282 180 276 165 C 270 150 242 150 236 165 Z" fill="#fb923c"/>
  </g>

  <!-- Crossed Wrench Right -->
  <g transform="translate(256, 250) rotate(35) translate(-256, -250)">
    <rect x="246" y="170" width="20" height="120" rx="6" fill="#f97316"/>
    <path d="M 236 165 C 230 180 240 195 256 195 C 272 195 282 180 276 165 C 270 150 242 150 236 165 Z" fill="#fb923c"/>
  </g>

  <!-- Brand Text RR -->
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle" letter-spacing="2">ROUTE</text>
  <text x="256" y="355" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="#38bdf8" text-anchor="middle" letter-spacing="4">RESCUE LK</text>

  <!-- Glossy Reflection Overlay -->
  <path d="M 16 126 C 16 65 65 16 126 16 L 386 16 C 447 16 496 65 496 126 L 496 200 C 300 240 100 240 16 200 Z" fill="rgba(255,255,255,0.08)"/>
</svg>
